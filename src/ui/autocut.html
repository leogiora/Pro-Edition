<!-- Fragmento: o shell injeta isto direto em document.body, depois da folha da
     familia (auto-broll-premiere/src/ui/styles.css). Aqui fica so o acento
     desta ferramenta e o que nao existe na folha: a linha rotulo + select.

     Sem CSS Grid, sem gap, sem var(): nada disso e confiavel no UXP (ver
     auto-broll-premiere/docs/UXP_ARMADILHAS.md). -->
<style>
  .marca-nome::before {
    background-color: #4fc3a1;
  }

  .cod-pessoa {
    color: #4fc3a1;
  }

  .linha {
    display: flex;
    flex-direction: row;
    align-items: center;
    margin-bottom: 6px;
  }

  .linha:last-child {
    margin-bottom: 0;
  }

  .linha label {
    flex: 1 1 auto;
    min-width: 0;
    font-size: 12px;
    color: #9098a6;
  }

  .linha select {
    flex: none;
    width: 96px;
  }

  .campo {
    margin-bottom: 10px;
  }

  .acao sp-button {
    flex: 1 1 130px;
  }

  /* A previa lista ate 40 planos: mais alto que o log padrao da familia. */
  .log {
    height: 220px;
    margin: 0;
  }
</style>

<header class="topo">
  <div class="marca">
    <span class="marca-nome">Podcast AutoCut</span>
  </div>
  <div id="acEstado" class="badge">carregando</div>
</header>

<main class="conteudo">
  <section class="secao">
    <div class="secao-cabeca">
      <span class="cod">SEQ</span>
      <span class="secao-rotulo">Sequência ativa</span>
    </div>
    <div class="secao-corpo">
      <div id="acSeqNome" class="seq-nome" data-vazio="sim">Nenhuma sequência selecionada</div>
      <div class="linha"><label for="acFps">Quadros por segundo</label><select id="acFps"></select></div>
    </div>
  </section>

  <div class="par">
    <section class="secao">
      <div class="secao-cabeca">
        <span class="cod cod-pessoa">A</span>
        <span class="secao-rotulo">Pessoa A</span>
      </div>
      <div class="secao-corpo">
        <div class="linha"><label for="acVideoA">Câmera</label><select id="acVideoA"></select></div>
        <div class="linha"><label for="acAudioA">Microfone</label><select id="acAudioA"></select></div>
      </div>
    </section>

    <section class="secao">
      <div class="secao-cabeca">
        <span class="cod cod-pessoa">B</span>
        <span class="secao-rotulo">Pessoa B</span>
      </div>
      <div class="secao-corpo">
        <div class="linha"><label for="acVideoB">Câmera</label><select id="acVideoB"></select></div>
        <div class="linha"><label for="acAudioB">Microfone</label><select id="acAudioB"></select></div>
      </div>
    </section>
  </div>

  <section class="secao">
    <div class="secao-cabeca">
      <span class="cod">WAV</span>
      <span class="secao-rotulo">Quem fala, pelo nível do áudio (opcional)</span>
    </div>
    <div class="secao-corpo">
      <label class="campo">
        <span class="campo-rotulo">Caminho do WAV com um canal por pessoa</span>
        <sp-textfield id="acWav" placeholder="vazio = usa a transcrição"></sp-textfield>
        <span class="campo-nota">
          Exporte do Premiere em WAV PCM mantendo os canais; 16 kHz basta. Vazio, a análise usa a transcrição dos
          clipes de áudio.
        </span>
      </label>
      <div class="linha"><label for="acCanalA">Canal da pessoa A</label><select id="acCanalA"></select></div>
      <div class="linha"><label for="acCanalB">Canal da pessoa B</label><select id="acCanalB"></select></div>
    </div>
  </section>

  <div class="acao">
    <sp-button id="acAnalisar" variant="secondary">Analisar</sp-button>
    <sp-button id="acAplicar" variant="cta" disabled>Aplicar cortes</sp-button>
  </div>

  <section class="secao secao-log">
    <div class="secao-cabeca">
      <span class="cod">LOG</span>
      <span class="secao-rotulo">Registro</span>
    </div>
    <div class="secao-corpo">
      <pre id="acLog" class="log">Abra a sequência do podcast e clique em Analisar.</pre>
    </div>
  </section>
</main>
