<!-- Fragmento: o shell injeta isto em document.body, depois da folha da
     familia (ferramentas/auto-broll/src/ui/styles.css). Layout do prototipo
     escolhido pelo Leo em 01/10. UXP: sem CSS Grid, sem gap, sem var(), sem
     largura em %; o que e clicavel e div[role=button] (UXP_ARMADILHAS.md). -->
<style>
  /* ---- etapas: bolinha com o simbolo e o nome embaixo */
  .etapas {
    display: flex;
    flex-direction: row;
    padding-top: 6px;
  }

  .etapa {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1 1 0px;
    min-width: 0;
    cursor: pointer;
  }

  .bola {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    margin-bottom: 3px;
    border: 1px solid #333b47;
    border-radius: 13px;
    background-color: #14171d;
  }

  .etapa-nome {
    font-size: 11px;
    color: #9098a6;
    text-align: center;
    white-space: nowrap;
  }

  /* ---- grade de variacoes */
  .grade {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    margin: 4px -3px 0 -3px;
  }

  .var {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    flex: none;
    width: 58px;
    margin: 3px;
    padding: 5px 6px;
    background-color: #14171d;
    border: 1px solid #232830;
    border-radius: 7px;
    cursor: pointer;
  }

  .var[data-sel="sim"] {
    background-color: #1a1e26;
    border-color: #3b82f6;
  }

  .var-cima {
    display: flex;
    flex-direction: row;
    align-items: center;
  }

  .var-nome {
    flex: 1 1 auto;
    font-size: 11px;
    font-weight: 600;
    color: #eceef2;
  }

  .var-st {
    flex: none;
    font-size: 11px;
    color: #5f6774;
  }

  .var-st[data-tom="ok"] { color: #4ecb8d; }
  .var-st[data-tom="aviso"] { color: #eeab4c; }
  .var-st[data-tom="ativo"] { color: #3b82f6; }

  .var-barra {
    display: flex;
    flex-direction: row;
    height: 3px;
    margin-top: 5px;
    border-radius: 2px;
    overflow: hidden;
    background-color: #101318;
  }

  .var-feito { background-color: #3b82f6; }
  .var-feito[data-tom="ok"] { background-color: #4ecb8d; }
  .var-feito[data-tom="aviso"] { background-color: #eeab4c; }

  .aviso-var {
    margin-top: 4px;
    font-size: 12px;
    color: #eeab4c;
  }

  /* ---- abas */
  .abas {
    display: flex;
    flex-direction: row;
    margin: 8px 0 6px 0;
  }

  .aba {
    flex: none;
    padding: 3px 12px;
    margin-right: 4px;
    border: 1px solid transparent;
    border-radius: 11px;
    font-size: 12px;
    color: #9098a6;
    cursor: pointer;
  }

  .aba[data-on="sim"] {
    border-color: #333b47;
    background-color: #1a1e26;
    color: #eceef2;
  }

  #edReguaAntes {
    height: 3px;
    border-radius: 2px;
    background-color: #ff7d71;
  }

  /* ---- quadros: um por pedaco da V1 */
  .quadros {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    margin: 0 -3px;
  }

  .qd {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    flex: none;
    width: 46px;
    margin: 3px;
    cursor: pointer;
  }

  .qd-tela {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    height: 82px;
    border: 1px solid #232830;
    border-radius: 5px;
    overflow: hidden;
    background-color: #000000;
  }

  .qd-tela[data-leak="sim"] {
    border-color: #eeab4c;
  }

  .qd-tempo {
    margin-top: 2px;
    font-size: 11px;
    color: #5f6774;
    text-align: center;
  }

  .qd-leg {
    font-size: 11px;
    color: #eceef2;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .qd-leg[data-preco="sim"] {
    color: #ff7d71;
  }

  /* ---- fala: cada palavra e um item de flex-wrap (sem texto corrido no UXP) */
  .fala {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
  }

  .pl {
    flex: none;
    margin: 0 4px 6px 0;
    padding: 0 1px;
    font-size: 13px;
    color: #c9ced8;
    cursor: pointer;
  }

  .pl[data-coberta="sim"] {
    background-color: #2b2650;
    color: #eceef2;
    border-bottom: 2px solid #8d82f5;
  }

  .pl[data-preco="sim"] {
    background-color: #ff7d71;
    color: #4a1b0c;
    font-weight: 600;
  }

  .pl-tag {
    flex: none;
    margin: 0 3px 6px 0;
    padding: 0 5px;
    border-radius: 4px;
    font-size: 11px;
    color: #cecbf6;
    background-color: #2b2650;
  }

  .pl-quebra,
  .pl-corte {
    flex: none;
    height: 14px;
    margin: 0 5px 6px 0;
  }

  .pl-quebra {
    width: 1px;
    background-color: #9098a6;
  }

  .pl-corte {
    width: 2px;
    background-color: #ff7d71;
  }

  .pl-mudo {
    flex: none;
    margin-bottom: 6px;
    font-size: 12px;
    color: #eeab4c;
  }
</style>

<header class="ed-topo">
  <span class="ed-titulo">AutoEdit <span id="edSeq" class="ed-seq">· lendo…</span></span>
  <span id="edPill" class="pill" data-tom="ativo">lendo</span>
</header>

<main id="edRolagem" class="conteudo">
  <div class="bloco">
    <div id="edEmpresas" class="chips"></div>
    <div id="edEtapas" class="etapas"></div>
    <div class="prog-linha"><span id="edProg" class="prog-txt">lendo a sequência…</span><span id="edCont" class="prog-cont"></span></div>
    <div class="barra"><span id="edBarraFeito" class="barra-feito" style="flex-grow: 0"></span><span id="edBarraResto" style="flex-grow: 1"></span></div>
    <div id="edGrade" class="grade"></div>
  </div>

  <div class="det">
    <div class="det-cabeca"><span id="edVarNome" class="det-nome"></span><span id="edVarDur" class="det-dur"></span></div>
    <div class="mets">
      <div class="met"><span class="met-rot">Cortes</span><span id="edMetCortes" class="met-val">–</span></div>
      <div class="met"><span class="met-rot">B-rolls</span><span id="edMetBroll" class="met-val" style="color: #8d82f5">–</span></div>
      <div class="met"><span class="met-rot">Legendas</span><span id="edMetLeg" class="met-val">–</span></div>
      <div class="met"><span class="met-rot">Preços</span><span id="edMetPreco" class="met-val" style="color: #ff7d71">–</span></div>
    </div>
    <div id="edAvisoVar" class="aviso-var" style="display: none"></div>

    <div class="abas">
      <div id="edAba_tl" class="aba" role="button" tabindex="0" data-on="sim">Timeline</div>
      <div id="edAba_qd" class="aba" role="button" tabindex="0" data-on="nao">Quadros</div>
      <div id="edAba_fl" class="aba" role="button" tabindex="0" data-on="nao">Fala</div>
    </div>

    <div id="edVista_tl">
      <div class="tl-caixa">
        <div class="tl">
          <div class="tl-linha"><span class="tl-rot"></span><div class="tl-faixa tl-regua"><span id="edReguaAntes" style="flex-grow: 0"></span><span class="tl-cursor"></span><span id="edReguaDepois" style="flex-grow: 1"></span></div></div>
          <div class="tl-linha"><span class="tl-rot">C2</span><div id="edTl_C2" class="tl-faixa"></div></div>
          <div class="tl-linha"><span class="tl-rot">C1</span><div id="edTl_C1" class="tl-faixa"></div></div>
          <div class="tl-linha"><span class="tl-rot">V3</span><div id="edTl_V3" class="tl-faixa"></div></div>
          <div class="tl-linha"><span class="tl-rot">V2</span><div id="edTl_V2" class="tl-faixa"></div></div>
          <div class="tl-linha"><span class="tl-rot">V1</span><div id="edTl_V1" class="tl-faixa"></div></div>
          <div class="tl-linha"><span class="tl-rot">A2</span><div id="edTl_A2" class="tl-faixa"></div></div>
          <div class="tl-ctrl"><span id="edPlay" class="tl-play" role="button" tabindex="0">▶</span><span id="edTempo">0:00</span><span class="tl-dica">clique na timeline para pular</span></div>
        </div>
        <div id="edTela" class="tela">
          <div id="edTelaA" class="tela-parte" data-tipo="doutor" style="flex-grow: 1">doutor</div>
          <div id="edTelaB" class="tela-parte" data-tipo="broll" style="flex-grow: 0"></div>
        </div>
      </div>
      <div id="edTelaLeg" class="tela-leg"></div>
    </div>
    <div id="edVista_qd" class="quadros" style="display: none"></div>
    <div id="edVista_fl" style="display: none">
      <div class="legenda-fala">vermelho: a imagem corta · cinza: legenda nova · roxo: debaixo do B-roll</div>
      <div id="edFala" class="fala"></div>
    </div>

    <div id="edFeed" class="feed"></div>
    <div id="edVerLog" class="ver-log" role="button" tabindex="0">ver o registro completo</div>
    <pre id="edLog" class="log" style="display: none"></pre>
  </div>
</main>

<footer class="rodape">
  <div id="edEditar" class="btn-pri" role="button" tabindex="0"><span id="edIcoTodas" class="btn-ico"></span>Editar todas</div>
  <div id="edSelecao" class="btn-sec btn-selecao" role="button" tabindex="0"><span id="edIcoSel" class="btn-ico"></span>Só a seleção</div>
  <div id="edRelir" class="btn-redondo" role="button" tabindex="0" title="Ler a sequência de novo" aria-label="Ler a sequência de novo"><span id="edIcoReler" class="btn-ico-so"></span></div>
</footer>
