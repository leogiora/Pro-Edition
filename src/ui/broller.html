<!-- B-Roller, no layout das telas novas (estilo comum em telas.css). A
     mesma tela no painel e no programa; o motor e que muda
     (ferramentas/auto-broll/src/broller.ts). UXP: sem grid, sem gap, sem var(); clicavel e div[role=button]. -->
<style>
  .br-rotulo {
    margin-bottom: 5px;
    font-size: 11px;
    color: #9098a6;
  }

  .br-pasta {
    align-self: stretch;
    margin-bottom: 8px;
    padding: 5px 8px;
    border: 1px solid #333b47;
    border-radius: 6px;
    background-color: #101318;
    color: #eceef2;
    font-size: 12px;
  }

  .tl-seg.br-antes { background-color: #5f6774; }

  .br-lista {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    margin-top: 8px;
  }

  .br-item {
    display: flex;
    flex-direction: row;
    align-items: center;
    padding: 4px 6px;
    border-bottom: 1px solid #1a1e26;
    font-size: 12px;
    color: #c9ced8;
  }

  .br-item-tempo {
    flex: none;
    width: 44px;
    color: #9098a6;
  }

  .br-item-arquivo {
    flex: none;
    width: 120px;
    color: #8d82f5;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .br-item-frase {
    flex: 1 1 auto;
    min-width: 0;
    margin-left: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
</style>

<header class="ed-topo">
  <span class="ed-titulo">B-Roller <span id="brSeq" class="ed-seq">· lendo…</span></span>
  <span id="brPill" class="pill" data-tom="ativo">lendo</span>
</header>

<main id="brRolagem" class="conteudo">
  <div class="bloco">
    <div class="br-rotulo">Pasta de B-rolls (fica salva depois da primeira análise que der certo)</div>
    <input id="brPasta" class="br-pasta" type="text" placeholder="cole o caminho da pasta" />
    <div id="brOpcoes" class="chips"></div>
    <div class="prog-linha"><span id="brProg" class="prog-txt">lendo a sequência…</span></div>
  </div>

  <div class="det">
    <div class="mets">
      <div class="met"><span class="met-rot">Na pasta</span><span id="brMetPasta" class="met-val">–</span></div>
      <div class="met"><span class="met-rot">Já na timeline</span><span id="brMetAntes" class="met-val">–</span></div>
      <div class="met"><span class="met-rot">Inseridos</span><span id="brMetNovos" class="met-val" style="color: #8d82f5">–</span></div>
    </div>

    <div class="tl-linha"><span class="tl-rot">V2</span><div id="brFaixa" class="tl-faixa"></div></div>
    <div class="tl-linha"><span class="tl-rot">V1</span><div class="tl-faixa"><span class="tl-seg tl-V1" style="flex-grow: 1"></span></div></div>

    <div id="brLista" class="br-lista"></div>

    <div id="brFeed" class="feed"></div>
    <div id="brVerLog" class="ver-log" role="button" tabindex="0">ver o registro completo</div>
    <pre id="brLog" class="log" style="display: none"></pre>
  </div>
</main>

<footer class="rodape">
  <div id="brAnalisar" class="btn-pri" role="button" tabindex="0"><span id="brIcoAnalisar" class="btn-ico"></span>Analisar e inserir</div>
  <div id="brAprender" class="btn-sec btn-selecao" role="button" tabindex="0"><span id="brIcoAprender" class="btn-ico"></span>Aprender</div>
  <div id="brReler" class="btn-redondo" role="button" tabindex="0" title="Ler a sequência de novo" aria-label="Ler a sequência de novo"><span id="brIcoReler" class="btn-ico-so"></span></div>
</footer>
