<!-- Fragmento: o shell injeta isto direto em document.body, depois da folha da
     familia (auto-broll-premiere/src/ui/styles.css). Aqui fica so o acento
     desta ferramenta e o que nao existe na folha.

     Botoes sao sp-button, nao <button>: o <button> nativo ignora o CSS no UXP.
     Sem CSS Grid, sem gap, sem var() (ver
     auto-broll-premiere/docs/UXP_ARMADILHAS.md). -->
<style>
  .marca-nome::before {
    background-color: #e07ba8;
  }

  .cod-split {
    color: #e07ba8;
  }

  .campo {
    margin-bottom: 12px;
  }

  .acao sp-button#asAplicar {
    flex: 2 1 180px;
  }

  .acao sp-button#asDiag {
    flex: 1 1 110px;
  }

  .log {
    height: 180px;
    margin: 0;
  }
</style>

<header class="topo">
  <div class="marca">
    <span class="marca-nome">Auto Split</span>
  </div>
  <div id="asEstado" class="badge">carregando</div>
</header>

<main class="conteudo">
  <section class="secao">
    <div class="secao-cabeca">
      <span class="cod">SEQ</span>
      <span class="secao-rotulo">Sequência ativa</span>
    </div>
    <div class="secao-corpo">
      <div id="asSeqNome" class="seq-nome" data-vazio="sim">Nenhuma sequência selecionada</div>
      <div class="dica">
        Último passo da edição: revise os B-rolls antes de aplicar. Um Ctrl+Z desfaz cada etapa.
      </div>
    </div>
  </section>

  <section class="secao">
    <div class="secao-cabeca">
      <span class="cod cod-split">V2+</span>
      <span class="secao-rotulo">Tela dividida</span>
    </div>
    <div class="secao-corpo">
      <label class="campo">
        <span class="campo-rotulo">Faixa dos B-rolls</span>
        <sp-textfield id="asFaixa" placeholder="todas acima da V1"></sp-textfield>
        <span class="campo-nota">O número como aparece no Premiere: V2 = 2. Vazio usa todas acima da V1.</span>
      </label>
      <label class="campo">
        <span class="campo-rotulo">Onde a tela divide (% da altura)</span>
        <sp-textfield id="asDivisao" value="50"></sp-textfield>
        <span class="campo-nota">50 = meio a meio. Aceita de 40 a 60.</span>
      </label>
      <sp-checkbox id="asRefazer">Refazer do zero (troca o efeito já aplicado)</sp-checkbox>
    </div>
  </section>

  <div class="acao">
    <sp-button id="asAplicar" variant="cta">Aplicar Auto Split</sp-button>
    <sp-button id="asDiag" variant="secondary" quiet>Diagnóstico</sp-button>
  </div>

  <section class="secao secao-log">
    <div class="secao-cabeca">
      <span class="cod">LOG</span>
      <span class="secao-rotulo">Registro</span>
    </div>
    <div class="secao-corpo">
      <pre id="asLog" class="log">Lendo a sequência...</pre>
    </div>
  </section>
</main>
