# Instaladores do programa Cutline: o do Mac (.dmg) so sai num Mac, entao os
# dois sao montados aqui, a cada push no main, e saem juntos numa Release
# "Cutline 0.2.<commits>" (a mesma versao que o programa mostra no topo).
name: Instaladores

on:
  push:
    branches: [main]
  pull_request: # monta para conferir, nao publica
  workflow_dispatch:

permissions:
  contents: write

jobs:
  montar:
    strategy:
      matrix:
        include:
          - os: macos-latest
            alvo: --mac
            arquivos: app/release/*.dmg
          - os: windows-latest
            alvo: --win nsis
            arquivos: app/release/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # a versao conta os commits
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.alvo }} --publish never -c.extraMetadata.version=$(node -e "import('./scripts/versao.mjs').then((m) => console.log(m.versao()))")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.arquivos }}

  publicar:
    needs: montar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: true
      - run: |
          v=$(node -e "import('./app/scripts/versao.mjs').then((m) => console.log(m.versao()))")
          gh release create "v$v" instaladores/* --title "Cutline $v" --notes "$(git log -1 --format=%s)"
        env:
          GH_TOKEN: ${{ github.token }}
