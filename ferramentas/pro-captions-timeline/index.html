<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Pro Captions: Timeline</title>
<style>
  html, body { margin: 0; padding: 0; background: #232323; color: #d6d6d6;
    font-family: "Segoe UI", Arial, sans-serif; font-size: 12px; }
  .caixa { padding: 12px; }
  h1 { font-size: 13px; font-weight: 600; margin: 0 0 8px 0; color: #f0f0f0; }
  button { width: 100%; padding: 9px 10px; margin: 0 0 8px 0; border: 0; border-radius: 4px;
    background: #1473e6; color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; }
  button:hover { background: #0d66d0; }
  button:disabled { background: #4b4b4b; color: #9a9a9a; cursor: default; }
  button.secundario { background: transparent; color: #b8b8b8; padding: 4px; font-weight: 400; }
  #saida { white-space: pre-wrap; line-height: 1.45; border-left: 3px solid #4b4b4b; padding: 6px 8px;
    background: #1b1b1b; border-radius: 2px; min-height: 40px; }
  #saida.ok { border-left-color: #2d9d78; }
  #saida.erro { border-left-color: #e34850; }
</style>
</head>
<body>
<div class="caixa">
  <h1>Pro Captions: Timeline</h1>
  <button id="colocar">Colocar legendas na timeline</button>
  <div id="saida">Verificando…</div>
  <button id="atualizar" class="secundario">Verificar de novo</button>
</div>
<script>
  // O CEP expoe a ponte com o ExtendScript em window.__adobe_cep__. Usar direto
  // dispensa o CSInterface.js (que teria de vir junto no pacote).
  function rodar(chamada, depois) {
    if (!window.__adobe_cep__) {
      depois("ERRO|Este painel só funciona dentro do Premiere.");
      return;
    }
    window.__adobe_cep__.evalScript(chamada, function (resposta) { depois(String(resposta || "")); });
  }

  function mostrar(resposta) {
    var saida = document.getElementById("saida");
    var partes = resposta.split("|");
    var tipo = partes.shift();
    var texto = partes.join("|");
    if (tipo !== "OK" && tipo !== "ERRO") {
      // Resposta fora do combinado: o host.jsx nao carregou ou lancou antes do try.
      tipo = "ERRO";
      texto = "O script não respondeu como esperado: " + (resposta || "(vazio)");
    }
    saida.className = tipo === "OK" ? "ok" : "erro";
    saida.textContent = texto;
  }

  function status() { rodar("proCaptions_status()", mostrar); }

  document.getElementById("colocar").addEventListener("click", function () {
    var botao = document.getElementById("colocar");
    botao.disabled = true;
    botao.textContent = "Colocando…";
    rodar("proCaptions_colocarNaTimeline()", function (r) {
      mostrar(r);
      botao.disabled = false;
      botao.textContent = "Colocar legendas na timeline";
    });
  });
  document.getElementById("atualizar").addEventListener("click", status);
  status();
</script>
</body>
</html>
